name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile with strict lint, run tests, package
        run: bash scripts/build.sh
